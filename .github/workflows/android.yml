name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build installable APK
        run: ./gradlew :app:assembleLatestUniversalDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK" dist/Net-Player-debug.apk
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Net-Player-APK
          path: dist/Net-Player-debug.apk
          if-no-files-found: error
